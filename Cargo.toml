# agent-bridge workspace（唯一實作正本）：bin/agent-bridge 是 exec shim，接到
# 建置產物 bin/ab。M4 cutover 起 Rust 為正本，bash 正本已於其後退役
# （git 歷史仍可取回）。驗收 gate＝不帶 BRIDGE 跑 tests/run-tests.sh 全綠。
[workspace]
resolver = "3"
members = ["crates/ab-core", "crates/ab", "crates/ab-tui"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/mangow314/agent-bridge"
